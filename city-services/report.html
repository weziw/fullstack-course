<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report an Issue | City Services</title>
    <link rel="stylesheet" href="styles.css">
    <script src="report.js" defer></script>
</head>

<body>
    <header>
        <h1>City Services</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="report.html" aria-current="page">Report an Issue</a>
                <a href="data.html">Open Data</a>
                <a href="contact.html">Contact</a>
            </nav>
    </header>

    <main>
        <h2>Report an Issue</h2>

        <p id="status" role="status"></p>

        <form id="report-form">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="category">Issue type</label>
            <select id="category" name="category" required>
                <option value="">Choose one</option>
                <option>Pothole</option>
                <option>Streetlight</option>
                <option>Graffiti</option>
            </select>

            <label for="address">Address or location</label>
            <input id="address" name="address" type="text" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" maxlength="500"></textarea>
            <p id="desc-count">0 / 500 characters</p>

            <button type="submit">Submit report</button>
        </form>

        <section> 
            <h3>Your reports this session (<span id="report-count">0</span>)</h3>
            <ul id="report-list"></ul>
            <button type="button" id="clear-list">Clear list</button>
        </section>
    </main>

    <footer>
        <p>City Services Practice Site</p>
    </footer>
</body>

</html>
